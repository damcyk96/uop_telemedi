name: Technical task
description: Plan maintenance, refactoring, documentation, or developer tooling work
title: "[Task]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to change and why is the work valuable?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe the current state, constraints, and relevant project area.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and what is explicitly out of scope?
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: Which parts of the project may be affected?
      options:
        - label: Application code
        - label: Mock API or data
        - label: Tests
        - label: Developer tooling
        - label: Documentation
        - label: CI or repository configuration

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this task to be considered complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Which automated checks or manual inspections are required?
      placeholder: |
        - npm run test
        - npm run build
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation notes
      description: Optional technical hints, risks, dependencies, or preferred patterns.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional links to documentation, related issues, or examples.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - ASAP — it blocks other work
        - Needed before a specific date
        - Nice to have
        - Backlog
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact person
      description: Who should be contacted if more context is needed?

